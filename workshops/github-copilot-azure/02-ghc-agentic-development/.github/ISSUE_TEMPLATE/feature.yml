name: Checkout API feature
description: Define a scoped, testable Checkout API behavior change.
title: "[Checkout] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user-visible problem, not a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Given / When / Then acceptance criteria
      description: Include normal, boundary, and error scenarios.
      placeholder: |
        Given ...
        When ...
        Then ...
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and non-goals
      description: State compatibility, security, performance, and excluded work.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Required evidence
      description: Name the focused test or command a reviewer can rerun.
    validations:
      required: true
